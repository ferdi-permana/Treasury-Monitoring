<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>USDT/IDR Treasury Market Monitor</title>
  <style>
    :root {
      --bg: #f5f7f9;
      --surface: #ffffff;
      --surface-2: #eef2f6;
      --ink: #1c2430;
      --muted: #667485;
      --line: #d9e1ea;
      --buy: #087f5b;
      --buy-bg: #e7f5ef;
      --sell: #c92a2a;
      --sell-bg: #fff0f0;
      --warn: #b7791f;
      --warn-bg: #fff7e6;
      --info: #2f6f9f;
      --info-bg: #e8f3fb;
      --bad-bg: #fff0f0;
      --shadow: 0 16px 40px rgba(23, 37, 51, 0.08);
      --radius: 8px;
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      min-width: 320px;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 6px;
      min-height: 36px;
      padding: 0 12px;
      cursor: pointer;
    }

    button:hover {
      border-color: #9fb2c4;
      background: #f8fafc;
    }

    button.primary {
      border-color: #245b87;
      background: #245b87;
      color: #ffffff;
    }

    input {
      width: 160px;
      max-width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      color: var(--ink);
      background: var(--surface);
    }

    .page {
      width: min(1600px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 3vw, 38px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      min-width: 280px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 12px;
      background: var(--surface);
      color: var(--muted);
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex: 0 0 auto;
    }

    .fresh .status-dot,
    .status-dot.fresh {
      background: var(--buy);
    }

    .delayed .status-dot,
    .status-dot.delayed {
      background: var(--warn);
    }

    .error .status-dot,
    .status-dot.error {
      background: var(--sell);
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .snapshot-grid {
      grid-template-columns: minmax(280px, 480px);
      margin-bottom: 16px;
    }

    .panel,
    .exchange-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .panel {
      padding: 16px;
    }

    .panel-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    h2,
    h3 {
      margin: 0;
      letter-spacing: 0;
    }

    h2 {
      font-size: 18px;
    }

    h3 {
      font-size: 16px;
    }

    .metric-value {
      display: block;
      margin-top: 6px;
      font-size: clamp(22px, 2.3vw, 32px);
      line-height: 1.08;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .metric-label,
    .meta,
    .small {
      color: var(--muted);
      font-size: 12px;
    }

    .metric-label {
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 700;
    }

    .bca-rate-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-top: 12px;
      border-top: 1px solid var(--line);
    }

    .bca-rate-item {
      padding-top: 12px;
      min-width: 0;
    }

    .bca-rate-item + .bca-rate-item {
      border-left: 1px solid var(--line);
      padding-left: 16px;
      margin-left: 16px;
    }

    .bca-rate-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .bca-rate-number {
      display: block;
      margin-top: 5px;
      font-size: clamp(22px, 2.3vw, 30px);
      line-height: 1.08;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .trend-buy {
      color: var(--buy);
    }

    .trend-sell {
      color: var(--sell);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    th {
      background: var(--surface-2);
      color: var(--muted);
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .book-grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .exchange-card {
      overflow: hidden;
    }

    .exchange-head {
      display: grid;
      gap: 14px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }

    .exchange-meta {
      display: grid;
      gap: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .exchange-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 1px solid var(--line);
    }

    .stat {
      padding: 10px 12px;
      border-right: 1px solid var(--line);
    }

    .stat:last-child {
      border-right: 0;
    }

    .stat strong {
      display: block;
      margin-top: 4px;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }

    .book-tables {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
    }

    .exchange-card table {
      font-size: 11px;
    }

    .exchange-card th,
    .exchange-card td {
      padding: 7px 6px;
    }

    .book-side {
      overflow-x: auto;
    }

    .book-side:first-child {
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }

    .side-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .side-title.buy {
      color: var(--buy);
      background: var(--buy-bg);
    }

    .side-title.sell {
      color: var(--sell);
      background: var(--sell-bg);
    }

    .source-grid {
      grid-template-columns: repeat(5, minmax(180px, 1fr));
      margin-top: 16px;
    }

    .source-box {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      background: #fbfcfe;
      min-height: 104px;
    }

    .source-box strong {
      display: block;
      margin: 6px 0 5px;
    }

    .mono {
      font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
      font-size: 12px;
    }

    .footer-note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 1180px) {
      .source-grid {
        grid-template-columns: repeat(2, minmax(220px, 1fr));
      }

      .book-grid {
        grid-template-columns: repeat(2, minmax(300px, 1fr));
      }
    }

    @media (max-width: 760px) {
      .page {
        padding: 16px;
      }

      .topbar {
        display: grid;
      }

      .toolbar {
        justify-content: flex-start;
        min-width: 0;
      }

      .snapshot-grid,
      .source-grid {
        grid-template-columns: 1fr;
      }

      .bca-rate-grid {
        grid-template-columns: 1fr;
      }

      .bca-rate-item + .bca-rate-item {
        border-left: 0;
        border-top: 1px solid var(--line);
        padding-left: 0;
        margin-left: 0;
        margin-top: 12px;
      }

      .exchange-head {
        display: grid;
        text-align: left;
      }

      .exchange-meta {
        text-align: left;
      }

      .exchange-stats,
      .book-tables {
        grid-template-columns: 1fr;
      }

      .stat,
      .book-side:first-child {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1>USDT/IDR Treasury Market Monitor</h1>
        <div class="subtitle">Reku, Tokocrypto, Indodax, Pintu Pro, dan BCA e-Rate</div>
      </div>
      <div class="toolbar">
        <span class="pill" id="cycle-status"><span class="status-dot delayed"></span><span>Menunggu data</span></span>
        <span class="pill">Refresh: <strong id="countdown">5m 00s</strong></span>
        <button class="primary" id="refresh-button" type="button">Refresh</button>
      </div>
    </header>

    <section class="grid snapshot-grid" aria-label="BCA e-Rate">
      <div class="panel">
        <span class="metric-label">BCA e-Rate USD</span>
        <div class="bca-rate-grid">
          <div class="bca-rate-item">
            <span class="bca-rate-label">Harga Beli</span>
            <strong class="bca-rate-number trend-buy" id="bca-buy-rate">-</strong>
          </div>
          <div class="bca-rate-item">
            <span class="bca-rate-label">Harga Jual</span>
            <strong class="bca-rate-number trend-sell" id="bca-sell-rate">-</strong>
          </div>
        </div>
        <span class="meta" id="bca-updated">-</span>
      </div>
    </section>

    <section class="grid book-grid" id="exchange-grid" aria-label="Order books"></section>

    <section class="grid source-grid" id="source-grid" aria-label="Latest updates"></section>

    <div class="footer-note">
      Data otomatis refresh setiap 5 menit. Semua waktu ditampilkan dalam WIB.
    </div>
  </main>

  <script>
    const REFRESH_SECONDS = 300;
    const REQUEST_TIMEOUT_MS = 14000;

    const state = {
      exchanges: {},
      bca: null,
      countdown: REFRESH_SECONDS,
      countdownTimer: null,
      inFlight: false
    };

    const exchangeConfigs = [
      { key: "reku", name: "Reku", fetcher: fetchReku },
      { key: "tokocrypto", name: "Tokocrypto", fetcher: fetchTokocrypto },
      { key: "indodax", name: "Indodax", fetcher: fetchIndodax },
      { key: "pintu", name: "Pintu Pro", fetcher: fetchPintu }
    ];

    const els = {
      exchangeGrid: document.getElementById("exchange-grid"),
      sourceGrid: document.getElementById("source-grid"),
      countdown: document.getElementById("countdown"),
      cycleStatus: document.getElementById("cycle-status"),
      refreshButton: document.getElementById("refresh-button"),
      bcaBuyRate: document.getElementById("bca-buy-rate"),
      bcaSellRate: document.getElementById("bca-sell-rate"),
      bcaUpdated: document.getElementById("bca-updated")
    };

    boot();

    function boot() {
      renderShell();
      bindEvents();
      refreshAll();
      startCountdown();
    }

    function bindEvents() {
      els.refreshButton.addEventListener("click", refreshAll);
    }

    function renderShell() {
      els.exchangeGrid.innerHTML = exchangeConfigs.map((config) => `
        <article class="exchange-card" id="card-${config.key}">
          <div class="exchange-head">
            <div>
              <h3>${config.name}</h3>
              <div class="meta">USDT/IDR order book depth 10</div>
            </div>
            <div class="exchange-meta">
              <span class="pill delayed"><span class="status-dot"></span><span id="${config.key}-status">Waiting</span></span>
              <span id="${config.key}-updated">Latest: -</span>
              <span id="${config.key}-fetched">Fetched: -</span>
            </div>
          </div>
          <div class="exchange-stats">
            <div class="stat"><span class="small">Best Ask</span><strong id="${config.key}-best-ask">-</strong></div>
            <div class="stat"><span class="small">Best Bid</span><strong id="${config.key}-best-bid">-</strong></div>
            <div class="stat"><span class="small">Spread</span><strong id="${config.key}-spread">-</strong></div>
          </div>
          <div class="book-tables">
            <div class="book-side">
              <div class="side-title sell"><span>Order Jual</span></div>
              <table>
                <thead>
                  <tr><th>#</th><th>Price</th><th>USDT</th><th>Cum. IDR</th></tr>
                </thead>
                <tbody id="${config.key}-asks"><tr><td colspan="4">-</td></tr></tbody>
              </table>
            </div>
            <div class="book-side">
              <div class="side-title buy"><span>Order Beli</span></div>
              <table>
                <thead>
                  <tr><th>#</th><th>Price</th><th>USDT</th><th>Cum. IDR</th></tr>
                </thead>
                <tbody id="${config.key}-bids"><tr><td colspan="4">-</td></tr></tbody>
              </table>
            </div>
          </div>
        </article>
      `).join("");

      els.sourceGrid.innerHTML = [
        ...exchangeConfigs.map((config) => sourceBox(config.key, config.name)),
        sourceBox("bca", "BCA e-Rate")
      ].join("");
    }

    function sourceBox(key, title) {
      return `
        <div class="source-box" id="source-${key}">
          <span class="pill delayed"><span class="status-dot"></span><span id="source-${key}-status">Waiting</span></span>
          <strong>${title}</strong>
          <div class="meta" id="source-${key}-latest">Latest: -</div>
          <div class="meta" id="source-${key}-fetched">Fetched: -</div>
          <div class="meta" id="source-${key}-age">Age: -</div>
        </div>
      `;
    }

    async function refreshAll() {
      if (state.inFlight) return;
      state.inFlight = true;
      setCycleStatus("delayed", "Refreshing...");
      els.refreshButton.disabled = true;

      const results = await Promise.all([
        ...exchangeConfigs.map(async (config) => {
          try {
            const data = await config.fetcher();
            state.exchanges[config.key] = { ...data, key: config.key, name: config.name, error: null };
          } catch (error) {
            state.exchanges[config.key] = {
              key: config.key,
              name: config.name,
              bids: [],
              asks: [],
              bestBid: null,
              bestAsk: null,
              spread: null,
              spreadBps: null,
              error: true,
              fetchedAt: new Date(),
              sourceUpdatedAt: null
            };
          }
        }),
        (async () => {
          try {
            state.bca = await fetchBcaRate();
          } catch (error) {
            state.bca = {
              buy: null,
              sell: null,
              updatedAtText: null,
              error: true,
              fetchedAt: new Date()
            };
          }
        })()
      ]);

      void results;
      state.inFlight = false;
      els.refreshButton.disabled = false;
      state.countdown = REFRESH_SECONDS;
      els.countdown.textContent = formatCountdown(state.countdown);
      setCycleStatus("fresh", `Updated ${formatTime(new Date())}`);
      render();
    }

    function startCountdown() {
      clearInterval(state.countdownTimer);
      state.countdownTimer = setInterval(() => {
        state.countdown -= 1;
        if (state.countdown <= 0) {
          state.countdown = REFRESH_SECONDS;
          refreshAll();
        }
        els.countdown.textContent = formatCountdown(state.countdown);
        renderSourceAges();
      }, 1000);
    }

    function render() {
      renderExchanges();
      renderBca();
      renderSourceAges();
    }

    function renderExchanges() {
      exchangeConfigs.forEach((config) => {
        const data = state.exchanges[config.key];
        const status = getSourceStatus(data);
        updateStatusPill(document.querySelector(`#card-${config.key} .pill`), status.kind, status.text);
        setText(`${config.key}-updated`, `Latest: ${latestText(data)}`);
        setText(`${config.key}-fetched`, `Fetched: ${data?.fetchedAt ? formatDateTime(data.fetchedAt) : "-"}`);

        setText(`${config.key}-best-bid`, data?.bestBid ? fmtIdr(data.bestBid.price) : "-");
        setText(`${config.key}-best-ask`, data?.bestAsk ? fmtIdr(data.bestAsk.price) : "-");
        setText(`${config.key}-spread`, data?.spread != null ? `${fmtIdr(data.spread)} (${fmtBps(data.spreadBps)})` : "-");
        setBookRows(`${config.key}-bids`, data?.bids || [], "bid");
        setBookRows(`${config.key}-asks`, data?.asks || [], "ask");
      });
    }

    function renderBca() {
      const bca = state.bca;
      const status = getSourceStatus(bca);
      updateStatusPill(document.querySelector("#source-bca .pill"), status.kind, status.text);
      setText("source-bca-latest", `Latest: ${latestText(bca)}`);
      setText("source-bca-fetched", `Fetched: ${bca?.fetchedAt ? formatDateTime(bca.fetchedAt) : "-"}`);
      setText("source-bca-age", `Age: ${bca?.fetchedAt ? relativeAge(bca.fetchedAt) : "-"}`);

      if (bca?.buy && bca?.sell) {
        els.bcaBuyRate.textContent = fmtIdr(bca.buy);
        els.bcaSellRate.textContent = fmtIdr(bca.sell);
        els.bcaUpdated.textContent = bca.updatedAtText || `Fetched ${formatDateTime(bca.fetchedAt)}`;
      } else {
        els.bcaBuyRate.textContent = "-";
        els.bcaSellRate.textContent = "-";
        els.bcaUpdated.textContent = "Belum tersedia";
      }
    }

    function renderSourceAges() {
      exchangeConfigs.forEach((config) => {
        const data = state.exchanges[config.key];
        const status = getSourceStatus(data);
        updateStatusPill(document.querySelector(`#source-${config.key} .pill`), status.kind, status.text);
        setText(`source-${config.key}-latest`, `Latest: ${latestText(data)}`);
        setText(`source-${config.key}-fetched`, `Fetched: ${data?.fetchedAt ? formatDateTime(data.fetchedAt) : "-"}`);
        setText(`source-${config.key}-age`, `Age: ${data?.fetchedAt ? relativeAge(data.fetchedAt) : "-"}`);
      });
      const bcaStatus = getSourceStatus(state.bca);
      updateStatusPill(document.querySelector("#source-bca .pill"), bcaStatus.kind, bcaStatus.text);
    }

    async function fetchReku() {
      // API v2 mengembalikan properti `.bids` dan `.asks` secara literal (bukan .b atau .s)
      const book = await fetchJson("https://api.reku.id/v2/orderbook?symbol=USDT_IDR");
      
      const rawBids = book.bids || book.b || [];
      const rawAsks = book.asks || book.s || [];
      
      const bids = normalizeRekuSide(rawBids, "bid");
      const asks = normalizeRekuSide(rawAsks, "ask");
      
      if (bids.length === 0 && asks.length === 0) {
        throw new Error("Struktur array orderbook Reku tidak dikenali.");
      }

      return finalizeBook({
        symbol: "USDT_IDR",
        bids,
        asks,
        fetchedAt: new Date(),
        sourceUpdatedAt: null,
        sourceUpdatedAtText: "API Reku Pro tidak menyertakan timestamp order book",
        note: "Reku Pro symbol: USDT_IDR"
      });
    }

    async function fetchTokocrypto() {
      const url = "https://www.tokocrypto.site/api/v3/depth?symbol=USDTIDR&limit=10";
      const payload = await fetchJson(url);
      if (payload.code !== 0 && payload.code !== undefined) throw new Error(payload.msg || "Tokocrypto mengembalikan status non-success.");
      const data = payload.data || payload;
      const bids = normalizePriceQtySide(data.bids || [], "bid");
      const asks = normalizePriceQtySide(data.asks || [], "ask");
      return finalizeBook({
        symbol: "USDTIDR",
        bids,
        asks,
        fetchedAt: new Date(),
        sourceUpdatedAt: payload.timestamp ? new Date(Number(payload.timestamp)) : null,
        sourceUpdatedAtText: payload.timestamp ? null : "API Tokocrypto tidak menyertakan timestamp valid",
        note: `lastUpdateId: ${data.lastUpdateId || "-"}`
      });
    }

    async function fetchIndodax() {
      const book = await fetchJsonWithCandidates([
        "https://indodax.com/api/depth/usdtidr",
        "https://indodax.com/api/depth/usdt_idr"
      ]);
      const bids = normalizePriceQtySide(book.buy || book.bids || [], "bid");
      const asks = normalizePriceQtySide(book.sell || book.asks || [], "ask");

      let ticker = null;
      try {
        ticker = await fetchJsonWithCandidates([
          "https://indodax.com/api/ticker/usdtidr",
          "https://indodax.com/api/ticker/usdt_idr"
        ]);
      } catch (error) {
        ticker = null;
      }

      const serverTime = Number(ticker?.ticker?.server_time || ticker?.server_time);
      return finalizeBook({
        symbol: "USDTIDR",
        bids,
        asks,
        fetchedAt: new Date(),
        sourceUpdatedAt: serverTime ? new Date(serverTime * 1000) : null,
        sourceUpdatedAtText: serverTime ? null : "Depth Indodax tidak menyertakan timestamp",
        note: ticker ? "Ticker server_time berhasil dibaca" : "Ticker server_time tidak tersedia"
      });
    }

    async function fetchPintu() {
      const endpoints = [
        "https://api.pintu.pro/v1/public/get-book?symbol=USDT-IDR&depth=10",
        "https://api.pintupro.com/v1/public/get-book?symbol=USDT-IDR&depth=10",
        "https://api.pintupro.com/v1/public/get-book?symbol=USDT-IDRT&depth=10",
        "https://api.uat.pintupro.com/v1/public/get-book?symbol=USDT-IDR&depth=10"
      ];
      const payload = await fetchJsonWithCandidates(endpoints);
      if (payload.code !== 0 && payload.code !== undefined) throw new Error(payload.reason || payload.message || "Pintu Pro mengembalikan status non-success.");
      const data = payload.data || payload;
      const bids = normalizePriceQtySide(data.bids || [], "bid");
      const asks = normalizePriceQtySide(data.asks || [], "ask");
      return finalizeBook({
        symbol: data.symbol || "USDT-IDR",
        bids,
        asks,
        fetchedAt: new Date(),
        sourceUpdatedAt: payload.timestamp ? new Date(Number(payload.timestamp)) : null,
        sourceUpdatedAtText: payload.timestamp ? null : "API Pintu Pro tidak menyertakan timestamp valid",
        note: `Symbol: ${data.symbol || "USDT-IDR"}`
      });
    }

    async function fetchBcaRate() {
      const html = await fetchText("https://www.bca.co.id/id/informasi/kurs");
      const doc = new DOMParser().parseFromString(html, "text/html");
      const text = normalizeSpace(doc.body ? doc.body.innerText : html);
      const updateMatch = text.match(/Terakhir diperbarui pada\s+(.+?)\s+Kurs jual/i)
        || text.match(/Last Updated at\s+(.+?)\s+Currency exchange/i)
        || text.match(/Terakhir diperbarui pada\s+(.+?WIB)/i)
        || text.match(/Last Updated at\s+(.+?WIB)/i);
      const usdMatch = text.match(/USD\s+E-Rate\s+Beli\s+([\d.,]+)\s+Jual\s+([\d.,]+)/i)
        || text.match(/USD\s+E-Rate\s+Buy\s+([\d.,]+)\s+Sell\s+([\d.,]+)/i)
        || text.match(/USD\s+([\d.,]+)\s+([\d.,]+)\s+[\d.,]+\s+[\d.,]+\s+[\d.,]+\s+[\d.,]+/i);

      if (!usdMatch) throw new Error("Format USD e-Rate BCA tidak terbaca.");

      return {
        buy: parseLocaleNumber(usdMatch[1]),
        sell: parseLocaleNumber(usdMatch[2]),
        updatedAtText: updateMatch ? normalizeSpace(updateMatch[1]) : "Timestamp resmi BCA tidak terbaca",
        fetchedAt: new Date(),
        sourceUpdatedAt: null,
        error: null
      };
    }

    async function fetchJson(url) {
      const response = await fetchRemote(url, "application/json");
      if (!response.ok) throw new Error(`${response.status} ${response.statusText} dari ${new URL(url).hostname}`);
      return response.json();
    }

    async function fetchText(url) {
      const response = await fetchRemote(url, "text/html,application/xhtml+xml");
      if (!response.ok) throw new Error(`${response.status} ${response.statusText} dari ${new URL(url).hostname}`);
      return response.text();
    }

    async function fetchJsonWithCandidates(urls) {
      const errors = [];
      for (const url of urls) {
        try {
          return await fetchJson(url);
        } catch (error) {
          errors.push(`${new URL(url).hostname}: ${readableError(error)}`);
        }
      }
      throw new Error(errors.join(" | "));
    }

    async function fetchRemote(url, accept) {
      const canUseProxy = location.protocol.startsWith("http");
      if (canUseProxy) {
        const proxyUrl = `/proxy?url=${encodeURIComponent(url)}`;
        const proxyResponse = await fetchWithTimeout(proxyUrl, { headers: { "Accept": accept } });
        if (proxyResponse.ok || proxyResponse.status !== 404) return proxyResponse;
      }
      return fetchWithTimeout(url, { headers: { "Accept": accept } });
    }

    async function fetchWithTimeout(url, options = {}) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
      try {
        return await fetch(url, {
          ...options,
          cache: "no-store",
          signal: controller.signal
        });
      } finally {
        clearTimeout(timeout);
      }
    }

    function normalizeRekuSide(levels, side) {
      if (!Array.isArray(levels)) return [];
      return levels
        .map((level) => {
          let price = 0, qty = 0;

          // Kasus 1: API Reku v2 bertipe Array sejati ["harga", "jumlah/volume"]
          if (Array.isArray(level)) {
            price = Number(level[0]);
            qty = Number(level[1]);
          } 
          // Kasus 2: API Reku v2 mengembalikan Objek Terstruktur { price: X, volume: Y }
          else if (level && typeof level === 'object') {
            price = Number(level.price || level.p || 0);
            qty = Number(level.volume || level.qty || level.q || 0);
          }

          return {
            price,
            qty,
            notional: price * qty,
            orders: null,
            side
          };
        })
        // Filter validasi: menolak NaN, tak terhingga, dan memastikan angka di atas nol
        .filter((level) => isFinite(level.price) && isFinite(level.qty) && level.price > 0 && level.qty > 0);
    }

    function normalizePriceQtySide(levels, side) {
      return levels
        .map((level) => {
          const price = Number(level[0]);
          const qty = Number(level[1]);
          return {
            price,
            qty,
            notional: price * qty,
            orders: level[2] != null ? Number(level[2]) : null,
            side
          };
        })
        .filter((level) => isFinite(level.price) && isFinite(level.qty));
    }

    function finalizeBook(book) {
      const bids = [...book.bids].sort((a, b) => b.price - a.price).slice(0, 10);
      const asks = [...book.asks].sort((a, b) => a.price - b.price).slice(0, 10);
      const bestBid = bids[0] || null;
      const bestAsk = asks[0] || null;
      const spread = bestBid && bestAsk ? bestAsk.price - bestBid.price : null;
      const spreadBps = spread != null && bestAsk.price ? (spread / bestAsk.price) * 10000 : null;
      return {
        ...book,
        bids,
        asks,
        bestBid,
        bestAsk,
        spread,
        spreadBps,
        error: null
      };
    }

    function setBookRows(id, levels, side) {
      const tbody = document.getElementById(id);
      if (!tbody) return;
      if (!levels.length) {
        tbody.innerHTML = `<tr><td colspan="4">-</td></tr>`;
        return;
      }

      let cumulative = 0;
      const displayLevels = side === "ask" ? [...levels].reverse() : levels;
      tbody.innerHTML = displayLevels.map((level, index) => {
        cumulative += level.price * level.qty;
        return `
          <tr>
            <td>${index + 1}</td>
            <td>${fmtIdr(level.price)}</td>
            <td>${fmtNumber(level.qty)}</td>
            <td>${fmtCompact(cumulative)}</td>
          </tr>
        `;
      }).join("");
    }

    function getSourceStatus(source) {
      if (!source) return { kind: "delayed", text: "Waiting" };
      if (source.error) return { kind: "error", text: "No data" };
      const ageSeconds = (Date.now() - new Date(source.fetchedAt).getTime()) / 1000;
      if (ageSeconds <= REFRESH_SECONDS + 30) return { kind: "fresh", text: "Live" };
      if (ageSeconds <= REFRESH_SECONDS * 2) return { kind: "delayed", text: "Delayed" };
      return { kind: "error", text: "Stale" };
    }

    function formatCountdown(seconds) {
      const safeSeconds = Math.max(0, Number(seconds) || 0);
      const minutes = Math.floor(safeSeconds / 60);
      const remainder = safeSeconds % 60;
      return `${minutes}m ${String(remainder).padStart(2, "0")}s`;
    }

    function setCycleStatus(kind, text) {
      updateStatusPill(els.cycleStatus, kind, text);
    }

    function updateStatusPill(pill, kind, text) {
      if (!pill) return;
      pill.classList.remove("fresh", "delayed", "error");
      pill.classList.add(kind);
      const dot = pill.querySelector(".status-dot");
      if (dot) {
        dot.className = `status-dot ${kind}`;
      }
      const label = pill.querySelector("span:last-child");
      if (label) label.textContent = text;
    }

    function latestText(source) {
      if (!source) return "-";
      if (source.error) return "-";
      if (source.sourceUpdatedAt) return formatDateTime(source.sourceUpdatedAt);
      if (source.updatedAtText) return source.updatedAtText;
      return source.fetchedAt ? formatDateTime(source.fetchedAt) : "-";
    }

    function relativeAge(dateValue) {
      const seconds = Math.max(0, Math.floor((Date.now() - new Date(dateValue).getTime()) / 1000));
      if (seconds < 60) return `${seconds}s`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ${seconds % 60}s`;
      const hours = Math.floor(minutes / 60);
      return `${hours}h ${minutes % 60}m`;
    }

    function fmtIdr(value) {
      if (value == null || !isFinite(value)) return "-";
      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: Math.abs(value) < 100 ? 2 : 0
      }).format(value);
    }

    function fmtNumber(value) {
      if (value == null || !isFinite(value)) return "-";
      return new Intl.NumberFormat("id-ID", {
        maximumFractionDigits: value < 1 ? 8 : 2
      }).format(value);
    }

    function fmtCompact(value) {
      if (value == null || !isFinite(value)) return "-";
      return new Intl.NumberFormat("id-ID", {
        notation: "compact",
        maximumFractionDigits: 2
      }).format(value);
    }

    function fmtBps(value) {
      if (value == null || !isFinite(value)) return "-";
      const sign = value > 0 ? "+" : "";
      return `${sign}${value.toFixed(1)} bps`;
    }

    function formatDateTime(value) {
      return new Intl.DateTimeFormat("id-ID", {
        dateStyle: "medium",
        timeStyle: "medium",
        timeZone: "Asia/Jakarta"
      }).format(new Date(value));
    }

    function formatTime(value) {
      return new Intl.DateTimeFormat("id-ID", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        timeZone: "Asia/Jakarta"
      }).format(new Date(value));
    }

    function parseLocaleNumber(value) {
      const text = String(value).trim();
      if (text.includes(".") && text.includes(",")) {
        if (text.lastIndexOf(",") > text.lastIndexOf(".")) {
          return Number(text.replace(/\./g, "").replace(",", "."));
        }
        return Number(text.replace(/,/g, ""));
      }
      if (text.includes(",")) {
        const parts = text.split(",");
        if (parts[parts.length - 1].length === 2) return Number(text.replace(/\./g, "").replace(",", "."));
        return Number(text.replace(/,/g, ""));
      }
      return Number(text.replace(/,/g, ""));
    }

    function normalizeSpace(text) {
      return String(text || "").replace(/\s+/g, " ").trim();
    }

    function setText(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text;
    }

    function readableError(error) {
      if (error?.name === "AbortError") return "Request timeout.";
      const message = error?.message || String(error);
      if (/Failed to fetch/i.test(message)) {
        return "Data belum tersedia.";
      }
      return message;
    }
  </script>
